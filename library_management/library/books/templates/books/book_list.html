<h1>Library Books</h1>
<a href="{% url 'book-add' %}">Add Book</a>
<ul>
    {% for book in books %}
    <li>
        <strong>{{ book.title }}</strong> by {{ book.author }} ({{ book.published_date }})
        [<a href="{% url 'book-edit' book.pk %}">Edit</a>]
        [<a href="{% url 'book-delete' book.pk %}">Delete</a>]
    </li>
    {% empty %}
    <li>No books available.</li>
    {% endfor %}
</ul>
