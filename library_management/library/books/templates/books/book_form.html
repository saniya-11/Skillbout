<h2>{% if book %}Edit{% else %}Add{% endif %} Book</h2>
<form method="post">
    {% csrf_token %}
    <label>Title:</label><br>
    <input type="text" name="title" value="{{ book.title|default:'' }}"><br><br>

    <label>Author:</label><br>
    <input type="text" name="author" value="{{ book.author|default:'' }}"><br><br>

    <label>Published Date:</label><br>
    <input type="text" name="published_date" value="{{ book.published_date|default:'' }}" placeholder="YYYY-MM-DD">


    <button type="submit">Save</button>
</form>
<a href="{% url 'book-list' %}">Back</a>
